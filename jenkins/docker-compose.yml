# Jenkins sur le VPS. Lancement (depuis ce dossier jenkins/) :
#   echo "DOCKER_GID=$(getent group docker | cut -d: -f3)" > .env
#   docker compose up -d --build
name: jenkins

services:
  jenkins:
    build: .
    container_name: jenkins
    restart: unless-stopped
    environment:
      JAVA_OPTS: "-Xmx768m"
    # Écoute uniquement sur le VPS lui-même : Jenkins n'est PAS exposé sur Internet.
    # Tu y accèdes depuis ton PC par un tunnel SSH (voir README).
    ports:
      - "127.0.0.1:8080:8080"
    # Donne à Jenkins le droit d'utiliser Docker sur le VPS
    group_add:
      - "${DOCKER_GID:?lance d'abord la commande echo DOCKER_GID=... du README}"
    volumes:
      # Même chemin sur le VPS et dans le conteneur : indispensable pour que
      # docker compose, lancé par Jenkins, retrouve les fichiers (Caddyfile...)
      - /var/jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
