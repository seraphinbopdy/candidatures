spring.application.name=candidatures

# Connexion à PostgreSQL : les valeurs viennent des variables d'environnement
# (fournies par Docker Compose). Les valeurs après ":" sont les valeurs par défaut.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/candidatures}
spring.datasource.username=${DB_USERNAME:candidatures}
spring.datasource.password=${DB_PASSWORD:candidatures}

# La structure de la base est gérée par Flyway (db/migration), jamais par Hibernate.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Derrière le reverse proxy Caddy : respecter les en-têtes X-Forwarded-*
server.forward-headers-strategy=framework
server.shutdown=graceful

# Santé de l'application : /actuator/health (et /liveness, /readiness pour Kubernetes)
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
